# Publishes a release: a container image on GHCR plus a GitHub Release.
#
# Triggered by pushing a version tag, so cutting a release is a deliberate
# act rather than a side effect of merging. The image is the only consumable
# form of this service -- package.json is `private: true`, so there is no npm
# artifact -- and APP_VERSION exists precisely to be stamped in at build time
# so /api/status reports the released version rather than "dev".
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

jobs:
  # The same gate CI runs. A tag push does not match ci.yml's
  # `push.branches`, so without this a release could publish an image no
  # test ever saw.
  verify:
    uses: ./.github/workflows/gate.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/smoke.sh shells out to `node` to read JSON, so pin the same
      # version the gate uses rather than relying on whatever the runner
      # image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Derive the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      # A tag that disagrees with package.json is the "same fact in two
      # places" drift this project keeps hitting. Fail early and loudly
      # rather than shipping an image whose version nobody can reconcile.
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} implies version ${{ steps.version.outputs.version }}," \
                 "but package.json declares $declared" >&2
            exit 1
          fi

      - name: Build the image
        run: |
          set -euo pipefail
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:latest" \
            .

      # Smoke the exact image that is about to be published, not a fresh
      # build of the same source: posts a signed delivery and checks it
      # lands, so a broken drain route cannot be released.
      - name: Smoke the built image
        env:
          SMOKE_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
        run: npm run smoke

      # --password-stdin so the token never appears in a command line or in
      # the run log.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the image
        run: |
          set -euo pipefail
          docker push "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          docker push "${{ steps.version.outputs.image }}:latest"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ask the API for the generated notes, then append the pull command,
          # and pass the result as a file. `--generate-notes` cannot be
          # combined with `--notes`, and building the body here keeps the
          # release self-contained for someone who lands on it cold.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body >notes.md
          {
            printf '\n\n## Image\n\n```\ndocker pull %s:%s\n```\n' \
              "${{ steps.version.outputs.image }}" "${{ steps.version.outputs.version }}"
          } >>notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
