name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Note this does NOT run on tag pushes: `push.branches` does not match a
  # tag ref. That is why release.yml calls the same gate itself rather than
  # assuming CI already covered the commit being released.
  verify:
    uses: ./.github/workflows/gate.yml

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run smoke
